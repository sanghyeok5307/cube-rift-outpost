  <style>

<body>
  <main id="game-shell">

      <div class="hud-top">

      <div class="status">

        <div class="ammo"><b id="ammo">12</b><span>/ ∞</span></div>
      </div>
      <div id="hit-marker">×</div>
    </div>
    <div id="damage"></div>
    <section id="menu">
      <div class="menu-card">
        <p class="kicker">ORIGINAL VOXEL SURVIVAL</p>
        <h1>CUBE RIFT <em>OUTPOST</em></h1>
        <p id="menu-copy">차원 균열이 전초기지를 삼키고 있습니다.<br>몰려오는 큐브 크리처를 막아내세요.</p>
        <div class="desktop-help"><span><b>WASD</b> 이동</span><span><b>MOUSE</b> 조준</span><span><b>CLICK · R</b> 사격 · 재장전</span></div>
        <button id="start" disabled>게임 준비 중…</button>
        <small>독립 제작 게임 · Mojang 및 Microsoft와 관련 없음</small>
      </div>
    </section>
    <div id="mobile-controls">
      <div id="look-zone"></div>
      <div id="stick"><div id="knob"></div></div>
      <button id="fire">FIRE</button>
      <button id="reload">R</button>
    </div>
    <div id="rotate-tip">휴대폰을 가로로 돌리면 더 편하게 플레이할 수 있습니다.</div>
  </main>
  <script type="module">

const cubeGeo=new THREE.BoxGeometry(1,1,1),world=new THREE.Group();scene.add(world);function block(x,y,z,mat=mats.grass,s=1){const o=new THREE.Mesh(cubeGeo,mat);o.position.set(x,y,z);o.scale.setScalar(s);o.castShadow=o.receiveShadow=true;world.add(o);return o}
for(let x=-19;x<=19;x++)for(let z=-22;z<=15;z++){const h=Math.max(0,Math.round((Math.sin(x*.44)+Math.cos(z*.35)-.55)*.8));block(x,-.55,z,mats.grass);for(let y=0;y<h;y++)block(x,.45+y,z,y===h-1?mats.grass:mats.dirt)}
for(let i=0;i<48;i++){const x=Math.floor(Math.random()*34-17),z=Math.floor(Math.random()*34-19);if(Math.abs(x)<4&&z>-3)continue;const h=1+Math.floor(Math.random()*3);for(let y=0;y<h;y++)block(x,.45+y,z,Math.random()>.45?mats.stone:mats.dirt)}
for(let i=0;i<8;i++){const x=-10+i*3;block(x,.55,-8,mats.wood,.2);block(x,1.4,-8,mats.wood,.2);const rail=block(x+1.5,1,-8,mats.wood,1);rail.scale.set(3,.16,.16)}
const portal=new THREE.Group();const portalBase=block(0,.12,-14,mats.violet,3);portalBase.scale.y=.08;world.add(portal);for(const x of [-1.55,1.55]){const p=block(x,2.2,-14,mats.stone,1);p.scale.set(.6,4.6,.6)}const cap=block(0,4.5,-14,mats.stone,1);cap.scale.set(3.7,.6,.6);const glow=block(0,2.35,-14,mats.violet,1);glow.scale.set(2.4,3.5,.25);
for(let i=0;i<12;i++){const c=new THREE.Mesh(new THREE.OctahedronGeometry(.18+Math.random()*.28,0),mats.cyan);c.position.set(Math.random()*30-15,.3+Math.random()*1.5,Math.random()*25-16);scene.add(c)}
const gun=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(.42,.34,1.1),mats.gun),barrel=new THREE.Mesh(new THREE.BoxGeometry(.2,.18,.72),mats.gun),core=new THREE.Mesh(new THREE.BoxGeometry(.19,.11,.5),mats.gunLight),sight=new THREE.Mesh(new THREE.BoxGeometry(.07,.1,.18),mats.gunLight);body.position.z=-.5;barrel.position.z=-1.25;core.position.set(.22,.03,-.52);sight.position.set(0,.23,-.62);gun.add(body,barrel,core,sight);gun.position.set(.43,-.39,-.68);camera.add(gun);scene.add(camera);
let running=false,score=0,wave=1,hp=100,ammo=12,reloading=false,spawnClock=0,yaw=0,pitch=0,bob=0,recoil=0,moveX=0,moveZ=0;const enemies=[],particles=[],keys={},clock=new THREE.Clock(),ray=new THREE.Raycaster(),velocity=new THREE.Vector3(),axisY=new THREE.Vector3(0,1,0);
function makeEnemy(){const g=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.25,.75),mats.enemy),head=new THREE.Mesh(new THREE.BoxGeometry(.84,.74,.74),mats.enemyDark),eye1=new THREE.Mesh(new THREE.BoxGeometry(.13,.13,.06),mats.eye),eye2=eye1.clone(),arm1=new THREE.Mesh(new THREE.BoxGeometry(.3,.95,.3),mats.enemy),arm2=arm1.clone();body.position.y=.75;head.position.y=1.7;eye1.position.set(-.21,1.77,-.405);eye2.position.set(.21,1.77,-.405);arm1.position.set(-.75,.8,0);arm2.position.set(.75,.8,0);g.add(body,head,eye1,eye2,arm1,arm2);g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});const a=Math.random()*Math.PI*2,d=14+Math.random()*7;g.position.set(camera.position.x+Math.sin(a)*d,0,camera.position.z+Math.cos(a)*d);scene.add(g);enemies.push({g,hp:2+Math.floor(wave/3),speed:.85+wave*.055,cool:0,t:Math.random()*5})}
